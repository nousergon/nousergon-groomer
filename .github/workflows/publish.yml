name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Dispatched by auto-tag.yml. A tag pushed by GITHUB_TOKEN does NOT trigger
  # `on: push: tags` (GitHub's workflow-loop prevention), so the auto-tag job
  # cannot rely on the tag alone to reach PyPI — it calls this explicitly.
  # A human-pushed tag still takes the `push` path above.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.2.1)"
        required: true

permissions:
  id-token: write  # trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify the wheel imports
        run: |
          pip install dist/*.whl
          python -c "import nousergon_groomer; print(nousergon_groomer.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
