name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Dispatched by auto-tag.yml. A tag pushed by GITHUB_TOKEN does NOT trigger
  # `on: push: tags` (GitHub's workflow-loop prevention), so the auto-tag job
  # cannot rely on the tag alone to reach PyPI — it calls this explicitly.
  # A human-pushed tag still takes the `push` path above.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.2.1)"
        required: true

permissions:
  id-token: write  # trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify the wheel imports
        run: |
          pip install dist/*.whl
          python -c "import nousergon_groomer; print(nousergon_groomer.__version__)"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
