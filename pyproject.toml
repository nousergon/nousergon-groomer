[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nousergon-groomer"
version = "0.11.1"
description = "Deterministic backlog groomer core: disposition function, dependency evaluator, admission controller, lane classifier. The fixture-runnable control plane for the autonomous backlog-and-PR maintenance loop."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Brian McMahon" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
groomer = "nousergon_groomer.cli:main"

[project.optional-dependencies]
config = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.9",
    "build>=1.0",
    # tests/test_coverage_scope.py parses this file; tomllib is 3.11+ and
    # requires-python floors at 3.9, where collection fails without this.
    "tomli>=2.0; python_version < '3.11'",
]
model = [
    "httpx>=0.24",
]
github = [
    "httpx>=0.24",
]
all = [
    "nousergon-groomer[config,model,github]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "S"]
ignore = ["E501", "UP045"]  # UP045 (Optional→X|None) breaks pydantic v2 on py3.9

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# store_contract.py is a conformance SUITE shipped as package code so private
# backends can run it (see its docstring). Its asserts are the deliverable.
"src/nousergon_groomer/store_contract.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["nousergon_groomer"]

# Enforces the coverage floor per repository-baseline-policy.md §4.2 C2 — a
# floor is meaningless unless pytest-cov exits non-zero below it, which it
# does automatically from this config even with no --cov-fail-under flag on
# the CI command line (verified locally: fail_under=99 against a 94.31%
# measured run exits 1).
#
# Raised to 94 on 2026-09-10 against 94.31% measured on the CI Python version
# (3.12, matching .github/workflows/test.yml's badge-publish leg). This repo
# carried no floor at all before this change — coverage could regress to 0%
# with the gate never noticing. A floor is a ratchet: raised as coverage
# improves, never lowered to make a change pass (§4.2 C3;
# tests/test_coverage_scope.py enforces the minimum going forward).
[tool.coverage.report]
fail_under = 94
